<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a9d8f" />

    <title>Nova Lifeguard — Insurance Portal</title>
    <meta name="description" content="Nova Lifeguard Insurance Portal — fast, transparent claims processing for life, funeral, and disability cover in Kenya." />
    <meta name="author" content="Nova Lifeguard" />

    <!-- Open Graph -->
    <meta property="og:title" content="Nova Lifeguard Insurance" />
    <meta property="og:description" content="Submit, track and manage your insurance claims in one secure place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- ── DNS prefetch for external origins ────────────────────────────── -->
    <!-- Supabase (auth + DB) -->
    <link rel="dns-prefetch" href="https://fqrnbejftfbuwsymdegz.supabase.co" />
    <link rel="preconnect" href="https://fqrnbejftfbuwsymdegz.supabase.co" crossorigin />
    <!-- Hero images -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Non-render-blocking Google Fonts ─────────────────────────────── -->
    <!-- Subset: only weights actually used (400, 500, 600, 700) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS: noscript renders it normally (render-blocking but rare) -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
